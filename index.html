<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>HSK Trainer</title>
<meta name="theme-color" content="#F8F4ED">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Vocabulario chino HSK 1–3 con repetición espaciada.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="HSK Trainer">
<style>
/* ── Sistema de diseño (rediseño 9-nov-2026, referencia: diseno/referencia-hsk-montanas.png) ── */
:root{
  --bg:#F8F4ED;--surface:#FFFCF7;--surface-2:#FBF7F0;
  --green:#587D50;--green-strong:#4A6B43;--green-dark:#183B2C;--green-soft:#E2E9D9;--green-softer:#EEF2E8;
  --ink:#202621;--ink-2:#5F625B;--ink-3:#6B6E66;--line:#E6DFD5;--line-soft:#EFE9E0;
  --terra:#B94D2B;--terra-soft:#F6E2D9;--ochre:#9A6A12;--ochre-soft:#F5EAD3;--red:#C94D3C;--red-soft:#F7E1DD;
  --radius:16px;--radius-lg:24px;--pill:999px;
  --shadow:0 1px 2px rgba(32,38,33,.04),0 8px 24px rgba(32,38,33,.07);
  --shadow-sm:0 1px 2px rgba(32,38,33,.05),0 2px 8px rgba(32,38,33,.04);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --t-fast:.15s ease;--t:.25s ease;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
[lang="zh-CN"],.zh{font-family:var(--font-zh)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Cabecera con paisaje */
.hdr{position:relative;padding:20px 16px 10px;min-height:118px;overflow:hidden}
.hdr-paisaje{position:absolute;right:-8px;top:0;height:100%;width:auto;max-width:78%;pointer-events:none;user-select:none}
.hdr-marca{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.hdr-logo{width:44px;height:auto;flex-shrink:0}
.hdr-title{font-size:21px;font-weight:800;letter-spacing:.04em;color:var(--green-dark);text-transform:uppercase;line-height:1.1}
.hdr-sub{font-size:14px;color:var(--green-strong);margin-top:2px}
.hdr-sello{font-family:var(--font-zh);background:var(--terra);color:#FFF7F2;font-size:11px;line-height:1.15;writing-mode:vertical-rl;padding:4px 2px;border-radius:3px;align-self:flex-start;margin-top:2px;letter-spacing:.05em}
.hdr-nube{position:relative;z-index:1;width:64px;height:auto;margin:4px 0 0 2px;display:block;opacity:.9}

/* Estadísticas */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);margin:0 16px 14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:12px 4px;position:relative;z-index:2}
.stat-item{text-align:center;padding:2px 4px;position:relative}
.stat-item+.stat-item::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:1px;background:var(--line)}
.stat-ico{width:22px;height:22px;display:block;margin:0 auto 4px;color:var(--green)}
.stat-item[data-stat="racha"] .stat-ico{color:var(--terra)}
.stat-n{font-size:22px;font-weight:800;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.stat-l{font-size:13px;color:var(--ink-3);margin-top:2px}

/* Filtros */
.filters{padding:0 16px 10px}
.filter-group{margin-bottom:10px}
.filter-label{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:15px;padding:8px 16px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;gap:7px;transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.chip svg{width:18px;height:18px;flex-shrink:0}
.chip:hover{border-color:#D6CDBF}
.chips-nivel .chip{flex:1 1 0;justify-content:center;padding:8px 10px;min-width:58px}
.chip.ap{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.chip.am{background:var(--green-soft);color:var(--green-dark);border-color:var(--green-soft);font-weight:600}
.chip.at{background:var(--green-dark);color:#fff;border-color:var(--green-dark);font-weight:600}
.chips-dir .chip{font-size:14px;min-height:44px;padding:6px 12px}
.btn-primary,.btn-start{padding:14px 18px;background:var(--green);border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;color:#fff;width:100%;min-height:52px;box-shadow:0 6px 16px rgba(88,125,80,.25);transition:background var(--t-fast),transform var(--t-fast)}
.btn-primary:hover,.btn-start:hover{background:var(--green-strong)}
.btn-primary:active,.btn-start:active{transform:scale(.99)}

/* Progreso de sesión */
.session-hdr{padding:2px 16px 12px;display:flex;align-items:center;gap:12px}
.session-info{flex:1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:12px}
.session-label{grid-column:1/-1;font-size:12px;color:var(--ink-3);margin-bottom:2px}
.session-count{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.session-bar-wrap{height:8px;background:#EDE5D9;border-radius:var(--pill);overflow:hidden}
.session-bar{height:100%;background:var(--green);border-radius:var(--pill);transition:width .4s ease}
.session-pct{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.btn-end{background:none;border:1px solid var(--line);border-radius:var(--pill);cursor:pointer;color:var(--ink-2);font-size:14px;padding:6px 14px;min-height:44px}
/* Con «Pausar» y «Terminar» la barra no cabe en la misma línea en móvil: va debajo, a todo el ancho */
@media (max-width:560px){.session-hdr{gap:8px}.session-info{grid-template-columns:auto 1fr;grid-template-areas:'l l' 'c p' 'b b'}.session-label{grid-area:l}.session-count{grid-area:c}.session-pct{grid-area:p}.session-bar-wrap{grid-area:b;margin-top:6px}.btn-end{padding:6px 12px}}

/* Tarjeta */
.card-wrap{padding:0 16px 14px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:56px 22px 26px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:aparecer .25s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-paisaje{position:absolute;right:0;bottom:0;width:62%;max-width:300px;height:auto;pointer-events:none;user-select:none;opacity:.95}
.card-badge{position:absolute;top:16px;left:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
.badge{font-size:13px;font-weight:600;padding:4px 11px;border-radius:var(--pill);display:inline-block}
.b-hsk1,.b-hsk2,.b-hsk3{background:var(--green-soft);color:var(--green-dark)}
.b-extra{background:var(--ochre-soft);color:#6B4A0E}
.b-new{background:#EFEAE1;color:var(--ink-2)}.b-learning{background:var(--ochre-soft);color:#6B4A0E}
.b-review{background:#E3ECEF;color:#24505E}.b-hard{background:var(--red-soft);color:#8E2F22}
.b-done{background:var(--green-soft);color:var(--green-dark)}
.card-hint{font-size:14px;color:var(--ink-3);margin-bottom:14px;position:relative}
.card-esp{font-size:28px;font-weight:700;color:var(--ink);line-height:1.3;position:relative}
.card-main{display:flex;align-items:center;justify-content:center;gap:14px;position:relative}
.card-char{font-family:var(--font-zh);font-size:clamp(64px,22vw,104px);line-height:1.05;color:var(--green-dark);font-weight:500;margin:4px 0;word-break:keep-all}
.card-char.sm{font-size:clamp(56px,18vw,88px)}
.btn-audio{width:52px;height:52px;border-radius:50%;border:none;background:var(--green-soft);color:var(--green-dark);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--t-fast)}
.btn-audio:hover{background:#D4DFC8}
.btn-audio svg{width:26px;height:26px}
.card-pin{font-size:28px;color:var(--green);font-weight:600;margin:6px 0 2px;position:relative}
.card-esp-small{font-size:20px;color:var(--ink-2);margin-top:4px;position:relative;max-width:100%;overflow-wrap:anywhere}
.card-sentence{margin-top:20px;padding:16px 0 4px;border-top:1px solid var(--line);text-align:left;width:100%;position:relative}
.card-sentence-in{border-left:3px solid var(--green);padding:2px 0 2px 12px;max-width:64%;position:relative;z-index:1}
.card-sentence-zh{font-family:var(--font-zh);font-size:19px;color:var(--ink);line-height:1.5}
.card-sentence-py{font-size:15px;color:var(--green-strong);margin-top:3px}
.card-sentence-es{font-size:15px;color:var(--ink-2);margin-top:3px}
.card-prog{margin-top:18px;width:100%;max-width:260px;position:relative}
.card-prog-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-bottom:4px}
.mini-bar{height:4px;background:#EDE5D9;border-radius:var(--pill)}
.mini-fill{height:100%;border-radius:var(--pill);transition:width .3s}
.btn-reveal{margin-top:24px;padding:15px 40px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);font-size:17px;font-weight:700;cursor:pointer;min-height:54px;width:100%;max-width:320px;position:relative;box-shadow:0 6px 16px rgba(88,125,80,.25)}
.btn-reveal:hover{background:var(--green-strong)}

/* Botones de respuesta */
.answer-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px calc(14px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:5;background:var(--bg)}
.abtn-cap{grid-column:1/-1;font-size:13px;color:var(--ink-3);text-align:center}
.abtn{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 4px;text-align:center;cursor:pointer;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform var(--t-fast),background var(--t-fast)}
.abtn:active{transform:scale(.97)}
.abtn-lbl{font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.abtn-lbl svg{width:16px;height:16px}
.abtn-t{font-size:13px;color:var(--ink-3)}
.a-again{border-color:var(--terra)}.a-again .abtn-lbl{color:var(--terra)}
.a-hard{border-color:#C79A45}.a-hard .abtn-lbl{color:var(--ochre)}
.a-good{background:var(--green);border-color:var(--green)}.a-good .abtn-lbl{color:#fff}.a-good .abtn-t{color:#E8F0E2}
.a-easy{border-color:var(--green-dark)}.a-easy .abtn-lbl{color:var(--green-dark)}

/* Estados vacíos y fin de sesión */
.empty-state{padding:28px 20px 32px;text-align:center}
.empty-icon{width:56px;height:56px;margin:0 auto 12px;color:var(--green)}
.empty-icon svg{width:100%;height:100%}
.empty-title{font-size:21px;font-weight:800;margin-bottom:8px;color:var(--ink)}
.empty-sub{font-size:15px;color:var(--ink-2);line-height:1.55;margin-bottom:22px}
.empty-actions{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto}
.btn-secondary{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;color:var(--ink);width:100%;min-height:50px}
.btn-secondary:hover{border-color:#D6CDBF}
.result-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px 18px;margin:0 16px 14px;position:relative;overflow:hidden}
.result-top{display:flex;justify-content:space-around;text-align:center;margin-bottom:16px}
.result-n{font-size:30px;font-weight:800;color:var(--green-dark);font-variant-numeric:tabular-nums}
.result-l{font-size:14px;color:var(--ink-3)}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.dist-i{border-radius:12px;padding:8px 2px;text-align:center;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-soft)}
.dist-i b{display:block;font-size:18px;color:var(--ink)}
.result-list{margin-top:14px;text-align:left}
.result-list-t{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.result-chip{display:inline-flex;align-items:baseline;gap:6px;background:var(--red-soft);color:#7A2A1E;border-radius:var(--pill);padding:5px 12px;margin:0 6px 6px 0;font-size:13px}
.result-chip .zh{font-size:17px;color:var(--ink)}

/* Navegación inferior */
.bot-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,252,247,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px max(8px,env(safe-area-inset-bottom));z-index:20}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;flex:1;min-height:52px;color:var(--ink-3);font-size:12px;justify-content:center;border-radius:12px;transition:color var(--t-fast)}
.nav-btn.active{color:var(--green);font-weight:700}
.nav-btn svg{width:25px;height:25px}

/* Paneles */
.panel{padding:4px 16px 0}
.panel-title{font-size:20px;font-weight:800;color:var(--green-dark);margin:2px 0 12px}
.hist-day{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}
.hist-item{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
.hist-char{font-family:var(--font-zh);font-size:28px;min-width:40px;text-align:center;line-height:1;color:var(--green-dark)}
.hist-info{flex:1;min-width:0}
.hist-esp{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-pin{font-size:14px;color:var(--green-strong);margin-top:1px}
.hist-right{text-align:right;white-space:nowrap}
.hist-result{font-size:13px;font-weight:700;padding:3px 10px;border-radius:var(--pill);display:inline-block}
.hr-ok{color:var(--green-dark);background:var(--green-soft)}.hr-fail{color:#7A2A1E;background:var(--red-soft)}.hr-hard{color:#6B4A0E;background:var(--ochre-soft)}
.hist-meta{font-size:13px;color:var(--ink-3);margin-top:3px}
.voc-search{width:100%;padding:13px 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink);margin-bottom:12px;-webkit-appearance:none;box-shadow:var(--shadow-sm)}
.voc-search:focus{border-color:var(--green)}
.voc-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.voc-chip{font-size:14px;padding:6px 13px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.voc-chip.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.voc-count{font-size:13px;color:var(--ink-3);margin:6px 0 8px}
.voc-item{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.voc-char{font-family:var(--font-zh);font-size:26px;min-width:44px;text-align:center;color:var(--green-dark)}
.voc-info{flex:1;min-width:0}
.voc-esp{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.voc-pin{font-size:14px;color:var(--green-strong);margin-top:1px}
.voc-right{text-align:right;white-space:nowrap}
.voc-pct{font-size:14px;font-weight:700;margin-top:4px}
.voc-seen{font-size:13px;color:var(--ink-3);margin-top:2px}
.dif-item{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.dif-top{display:flex;align-items:center;gap:12px}
.dif-char{font-family:var(--font-zh);font-size:32px;min-width:46px;text-align:center;color:var(--green-dark)}
.dif-info{flex:1;min-width:0}
.dif-esp{font-size:15px;font-weight:600;margin-bottom:2px}
.dif-pin{font-size:14px;color:var(--green-strong);margin-bottom:5px}
.dif-stats{display:flex;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft)}
.dif-stat{text-align:center;flex:1}
.dif-stat-n{font-size:17px;font-weight:800}
.dif-stat-l{font-size:13px;color:var(--ink-3);margin-top:2px}
.settings-section{margin-bottom:20px}
.settings-title{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;padding:0 16px}
.settings-item{background:var(--surface);border-radius:var(--radius);margin:0 16px 6px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line-soft);min-height:54px;color:var(--ink)}
.settings-item-label{font-size:16px;color:var(--ink)}
button.settings-item,label.settings-item{width:calc(100% - 32px);font:inherit;text-align:left;cursor:pointer}
button.settings-item:hover,label.settings-item:hover{border-color:var(--line)}
select.native-sel{font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);cursor:pointer;padding:6px 10px;-webkit-appearance:none;text-align:right;min-height:44px}
.settings-item a{color:var(--green-strong)}
.modal-overlay{position:fixed;inset:0;background:rgba(24,59,44,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:24px;width:100%;max-width:520px;padding-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.modal-title{font-size:20px;font-weight:800;margin-bottom:8px}
.modal-sub{font-size:15px;color:var(--ink-2);line-height:1.5;margin-bottom:22px}
.modal-btns{display:flex;flex-direction:column;gap:10px}
.btn-danger{padding:15px;background:var(--red);border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;color:#fff;width:100%;min-height:52px}
.btn-cancel{padding:15px;background:#EFE9E0;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;color:var(--ink);width:100%;min-height:52px}
body.en-sesion #filterrow,body.en-pausa #filterrow{display:none}
.pres-aviso{margin:0 16px 10px;padding:10px 14px;border-radius:12px;background:var(--green-softer);color:var(--green-dark);font-size:15px;line-height:1.45}
.pres-btns{display:flex;flex-direction:column;gap:10px;padding:0 16px calc(16px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:var(--bg);padding-top:8px;z-index:5}
.btn-audio.sm{width:44px;height:44px;margin-top:8px}.btn-audio.sm svg{width:22px;height:22px}
.prevision{font-size:14px;color:var(--ink-2);line-height:1.5;margin-top:10px;position:relative}
button.voc-item{width:100%;font:inherit;text-align:left;cursor:pointer;color:inherit}
button.voc-item:hover{border-color:#D6CDBF}
.ficha-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ficha-char{font-family:var(--font-zh);font-size:56px;line-height:1.1;color:var(--green-dark)}
.ficha-pin{font-size:22px;color:var(--green);font-weight:600}
.ficha-esp{font-size:18px;color:var(--ink);margin:4px 0 10px}
.ficha-ej{border-left:3px solid var(--green);padding:2px 0 2px 12px;margin:10px 0 12px}
.ficha-datos{font-size:15px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
.modal-ficha{max-height:88vh;overflow-y:auto}
.pin-in{width:100%;max-width:320px;margin-top:18px;padding:12px 14px;font-size:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);text-align:center}
.pin-res{margin-top:10px;padding:8px 14px;border-radius:12px;font-size:15px;font-weight:600;position:relative}
.pin-ok{background:var(--green-soft);color:var(--green-dark)}.pin-tonos{background:var(--ochre-soft);color:#6B4A0E}.pin-no{background:var(--red-soft);color:#7A2A1E}
body.con-tarjeta .bot-nav{display:none}
body.con-tarjeta{padding-bottom:0}
.ayuda{font-size:15px;color:var(--ink-2);line-height:1.55;display:block}
.ayuda b{color:var(--ink)}
.settings-nota{font-size:14px;color:var(--ink-2);line-height:1.5;padding:0 16px 8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--green-dark);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.4;max-width:min(90vw,440px);z-index:60;box-shadow:var(--shadow)}
.result-next{font-size:15px;color:var(--ink-2);margin-top:12px;text-align:center}
body.en-sesion .hdr,body.en-juego .hdr{min-height:92px;padding-bottom:4px}
body.en-sesion .hdr-nube,body.en-juego .hdr-nube{display:none}
body.en-sesion .stats-bar{padding:8px 4px;margin-bottom:10px}
body.en-sesion .stat-ico{display:none}
/* Juegos (PLAN_JUEGOS.md, fase 1, 12-nov-2026) */
.juego-item,.tema-item{width:100%;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:72px}
.juego-item:hover,.tema-item:hover{border-color:#D6CDBF}
.tema-item[disabled]{cursor:default;box-shadow:none;background:var(--surface-2);border-style:dashed;border-color:var(--line)}
.juego-ico{width:46px;height:46px;border-radius:12px;background:var(--green-soft);color:var(--green-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.juego-ico svg{width:26px;height:26px}
.juego-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.juego-nombre{font-size:17px;font-weight:700;color:var(--ink)}
.juego-desc{font-size:14px;color:var(--ink-2);line-height:1.4}
.juego-flecha{color:var(--ink-3);font-size:24px;line-height:1}
.juego-nota{font-size:14px;color:var(--ink-3);text-align:center;margin-top:8px}
.juego-intro{font-size:15px;color:var(--ink-2);margin:-6px 0 14px}
.tema-muestra{display:grid;grid-template-columns:repeat(3,14px);gap:4px;flex-shrink:0;width:50px;justify-content:center}
.tema-muestra i{display:block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(32,38,33,.3)}
.btn-volver{background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);min-height:44px;min-width:44px;padding:6px 14px 6px 10px;font:inherit;font-size:15px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.btn-volver:hover{border-color:#D6CDBF}
.btn-volver span{font-size:22px;line-height:1;margin-top:-2px}
.jg-cab{margin:0 0 10px}
.memo{padding:0 16px}
.memo-bar{display:flex;align-items:center;gap:10px;height:48px;margin-bottom:8px}
.memo-titulo{flex:1;font-size:19px;font-weight:800;color:var(--green-dark);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-cont{font-size:14px;color:var(--ink-2);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap}
.memo-cont b{color:var(--ink);font-weight:700}
.memo-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;
  --memo-h:min(calc(100vh - 196px),calc((min(100vw,520px) - 48px) / 3 * 4 + 24px));
  --memo-h:min(calc(100svh - 196px - env(safe-area-inset-bottom)),calc((min(100vw,520px) - 48px) / 3 * 4 + 24px));
  height:var(--memo-h)}
.memo-card{position:relative;border:none;background:none;padding:0;cursor:pointer;perspective:800px;min-width:0;min-height:0;font:inherit;color:inherit;border-radius:14px;container-type:size}
.mc-in{position:absolute;inset:0;transition:transform .35s ease;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.memo-card.abierta .mc-in{transform:rotateY(180deg)}
.mc-dorso,.mc-frente{position:absolute;inset:0;border-radius:14px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.mc-dorso{background:var(--green-soft);border:1px solid #CBD7BE;color:var(--green);box-shadow:var(--shadow-sm)}
.mc-logo{width:52%;max-width:72px;height:auto;opacity:.8}
.mc-frente{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg);box-shadow:var(--shadow-sm);padding:8px 6px}
.mc-zh{font-family:var(--font-zh);font-size:30px;font-size:min(36px,30cqmin);line-height:1.15;color:var(--green-dark);white-space:nowrap}
.mc-pin{font-size:15px;color:var(--green-strong);white-space:nowrap}
.mc-color{display:block;width:70%;flex:1 1 auto;max-height:64%;min-height:0;border-radius:10px;border:1px solid rgba(32,38,33,.3)}
.mc-nom{font-size:15px;color:var(--ink-2);white-space:nowrap}
.mc-ok{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:none;align-items:center;justify-content:center}
.mc-ok svg{width:14px;height:14px}
.memo-card.hecha{cursor:default}
.memo-card.hecha .mc-frente{border:2px solid var(--green);background:var(--green-softer)}
.memo-card.hecha .mc-ok{display:flex}
.memo-card.mal .mc-frente{border:2px dashed var(--terra)}
.mc-no{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--terra);color:#fff;display:none;align-items:center;justify-content:center}
.mc-no svg{width:12px;height:12px}
.memo-card.mal .mc-no{display:flex}
.memo-card[aria-disabled=true]{cursor:default}
.memo-msg{font-size:15px;line-height:20px;min-height:20px;margin:0 0 8px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-msg.ok{color:var(--green-dark);font-weight:600}
.memo-msg.no{color:#8A3A20;font-weight:600}
.memo-fin{padding-top:12px}
.memo-repaso-t{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin:26px auto 4px;max-width:340px;text-align:left}
.memo-repaso{list-style:none;max-width:340px;margin:0 auto 8px;text-align:left}
.memo-repaso li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.mr-color{width:22px;height:22px;border-radius:6px;border:1px solid rgba(32,38,33,.3);flex-shrink:0}
.mr-zh{font-family:var(--font-zh);font-size:22px;color:var(--green-dark);min-width:52px}
.mr-pin{font-size:15px;color:var(--green-strong);min-width:64px}
.mr-es{flex:1;font-size:15px;color:var(--ink)}
.memo-repaso .btn-audio.sm{margin-top:0}
body.en-juego .bot-nav{display:none}
body.en-juego{padding-bottom:0}
@media (min-width:700px){.memo-board{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));
  --memo-h:min(calc(100vh - 196px),394px);--memo-h:min(calc(100svh - 196px),394px)}}
@media (orientation:landscape) and (max-height:500px){.memo-board{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
  --memo-h:calc(100vh - 196px);--memo-h:calc(100svh - 196px - env(safe-area-inset-bottom))}}
.hidden{display:none!important}
.empty{text-align:center;padding:2rem;color:var(--ink-3);font-size:15px}
@media (min-width:700px){body{max-width:560px}.bot-nav{max-width:560px}}
@media (max-width:400px){.chips-nivel{flex-wrap:nowrap;gap:5px}.chips-nivel .chip{min-width:0;padding:8px 2px;font-size:14px}.chip{font-size:14px;padding:7px 12px}.hdr-paisaje{max-width:58%;opacity:.8}.hdr-title{font-size:18px}.hdr-sub{font-size:13px}}
/* Con 6 pestañas, «Vocabulario» no cabe en un sexto del ancho por debajo de 360 px: cada botón ocupa según su texto */
@media (max-width:359px){.bot-nav{padding-left:2px;padding-right:2px}.nav-btn{font-size:11px;padding:6px 2px;flex:1 1 auto;min-width:0}}
@media (max-width:340px){.hdr-paisaje{max-width:50%;opacity:.7}.chips-nivel .chip{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

// Límite diario de palabras nuevas (F4). cfg.newDay={date,n}: nuevas presentadas hoy

function newToday(){return cfg.newDay&&cfg.newDay.date===todayStr()?cfg.newDay.n:0;}

// Si se baja el límite con una sesión a medias, quita de lo que queda las nuevas que sobran.
function trimNew(){
  if(!session)return;
  // La tarjeta en pantalla (idx) se conserva siempre y, si es nueva, gasta un hueco.
  var left=newLeft(),isNew=function(k){var p=prog[k];return!p||p.state==='new';};
  var done=session.queue.slice(0,session.idx+1),cur=session.queue[session.idx];
  if(cur!==undefined&&isNew(cur))left=Math.max(0,left-1);
  var rest=session.queue.slice(session.idx+1).filter(function(k){
    var p=prog[k];if(p&&p.state!=='new')return true;
    if(left>0){left--;return true;}return false;});
  session.queue=done.concat(rest);saveSes();
}

// F9: un solo criterio de «difícil» para la sesión y la pestaña
// Criterio ampliado el 10-nov-2026 (Eva): también una palabra fallada que aún no se ha vuelto a acertar
function esDificil(p){return p.state==='hard'||(p.seen>=2&&p.pct<60)||(p.fail>0&&p.streak===0);}

function getQueue(mode){
  var now=Date.now(),lv=filter.level;
  var base=lv==='all'?V:V.filter(function(w){return w.N===lv;});
  base=dedup(base);
  var nuevas=function(){return shuffle(base.filter(function(w){return gp(w).state==='new';})).slice(0,newLeft());};
  var vistas=function(){return base.filter(function(w){return gp(w).state!=='new';});};
  if(mode==='today'){
    var due=vistas().filter(function(w){return gp(w).nextReview<=now;});
    return shuffle(due).concat(nuevas());
  }
  if(mode==='new')return nuevas();
  if(mode==='hard')return base.filter(function(w){return esDificil(gp(w));}).sort(function(a,b){return gp(a).pct-gp(b).pct;});
  if(mode==='all'){var s=vistas().sort(function(a,b){return gp(a).pct-gp(b).pct;});return nuevas().concat(s);}
  // Tandas rápidas: solo palabras ya vistas (no meten nuevas fuera del límite)
  if(mode==='quick10')return shuffle(vistas()).slice(0,10);
  if(mode==='quick20')return shuffle(vistas()).slice(0,20);
  if(mode==='quick30')return shuffle(vistas()).slice(0,30);
  return[];
}

// Actualiza el progreso de una palabra con una respuesta. `now` se pasa para poder
// recuperar una respuesta que no llegó a guardarse (ver recoverLast).
// Intervalo siguiente (minutos) para una respuesta; lo usan rateWord y intLabel.
// Si la palabra viene de un fallo (intervalo de menos de 1 día), «Bien» la manda a 1 día y
// «Fácil» a 3, en vez de multiplicar los 10 minutos de «Otra vez» (antes salían 18 min).
function nextInterval(p,r){
  var iv=p.interval||0,e=p.ease||2;
  if(r==='again')return INTS.again;
  if(r==='hard')return Math.round(Math.max(INTS.hard,iv*0.5));
  if(iv<=0)return r==='good'?INTS.good:INTS.easy;
  if(iv<INTS.hard)return r==='good'?INTS.hard:INTS.good;
  var g=Math.min(iv*e,259200);
  return Math.round(r==='good'?g:Math.min(Math.max(iv*e*1.3,g+1440),525600));
}

function rateWord(p,r,now){
  if(p.conocida)delete p.conocida; // tras un repaso real ya no se puede «deshacer» como conocida
  p.seen++;p.lastReview=now;
  var ni=nextInterval(p,r);
  if(r==='again'){
    p.fail++;p.streak=0;p.interval=ni;
    p.state=p.state==='done'?'hard':p.seen<=2?'learning':'hard';
    p.ease=Math.max(1.3,p.ease-0.2);
  } else {
    p.ok++;p.streak++;
    if(r==='hard')p.ease=Math.max(1.3,p.ease-0.15);
    else if(r==='easy')p.ease=Math.min(2.8,p.ease+0.15);
    p.interval=ni;
  }
  // A1: el % se actualiza antes de decidir el estado (antes se miraba el de la respuesta anterior)
  p.pct=Math.round(p.ok/p.seen*100);
  if(r!=='again'){
    if(p.streak>=4&&p.pct>=85)p.state='done';
    else if(p.streak>=2)p.state='review';
    else p.state='learning';
    if(r==='hard'&&p.state!=='done')p.state='hard';
  }
  p.nextReview=now+p.interval*60000;
}

// Responder = actualizar progreso + avanzar la sesión, y guardar.
// La sesión se guarda primero, con la marca `last` de esta respuesta: si la app se cierra
// antes de guardar el progreso, recoverLast la vuelve a aplicar al abrir (una sola vez).
// F7: «Otra vez» vuelve a meter la palabra 3 tarjetas después (session.retry, como mucho
// 3 apariciones). Esa repetición solo fija el intervalo (relearnWord), no suma en los contadores.
var RETRY_GAP=3,RETRY_MAX=2;
function applyAnswer(w,r){
  var now=Date.now(),k=wk(w),p=gp(w);
  if(!session.retry)session.retry={};
  var isRetry=session.retry.hasOwnProperty(k);
  if(isRetry)relearnWord(p,r,now);
  else{if(p.seen===0)countNew();rateWord(p,r,now);}
  recent.unshift({k:k,rating:r,ts:now});
  if(recent.length>50)recent.pop();
  session.done++;
  if(r==='again')session.fail++;else session.ok++;
  var n=isRetry?session.retry[k]:0;
  if(r==='again'&&n<RETRY_MAX){
    session.queue.splice(Math.min(session.idx+1+RETRY_GAP,session.queue.length),0,k);
    session.retry[k]=n+1;
  } else delete session.retry[k];
  session.idx++;
  session.last={k:k,r:r,ts:now,retry:isRetry};
  // Reparto de respuestas y palabras falladas, para la pantalla de fin de sesión
  session.dist=session.dist||{again:0,hard:0,good:0,easy:0};session.dist[r]=(session.dist[r]||0)+1;
  if(r==='again'){session.fallos=session.fallos||[];if(session.fallos.indexOf(k)<0)session.fallos.push(k);}
  markDay();
  saveSes();saveProg();logResp(k,r,now);
}

// Repetición dentro de la sesión tras un fallo: no cuenta como repaso nuevo.
// Otra vez → 10 min; Difícil o Bien → 1 día; Fácil → 3 días.
function relearnWord(p,r,now){
  if(p.conocida)delete p.conocida;
  p.lastReview=now;
  p.interval=r==='again'?INTS.again:r==='easy'?INTS.good:INTS.hard;
  p.nextReview=now+p.interval*60000;
}
function recoverLast(s){
  if(!s||!s.last)return;
  var l=s.last,p=prog[l.k];
  if(p&&p.lastReview===l.ts)return;
  if(!p)p=prog[l.k]=dp();
  // countNew ya se hizo al responder (cfg se guarda antes que la sesión)
  if(l.retry)relearnWord(p,l.r,l.ts);else rateWord(p,l.r,l.ts);
  saveProg();
}

function intLabel(r,w){
  var p=gp(w),m;
  // En una repetición (F7) los intervalos son los de relearnWord
  if(session&&session.retry&&session.retry.hasOwnProperty(wk(w)))m=r==='again'?INTS.again:r==='easy'?INTS.good:INTS.hard;
  else m=nextInterval(p,r);
  m=Math.round(m);
  if(m<60)return m+' min';
  if(m<1440){var h=Math.round(m/60);return h+(h===1?' hora':' horas');}
  if(m<43200){var d=Math.round(m/1440);return d+(d===1?' día':' días');}
  var me=Math.round(m/43200);return me+(me===1?' mes':' meses');
}

function getStats(){
  var lv=filter.level,base=lv==='all'?V:V.filter(function(w){return w.N===lv;});
  base=dedup(base);var now=Date.now();
  var nN=0,nL=0,nR=0,nH=0,nD=0,nDue=0;
  base.forEach(function(w){var p=gp(w);
    if(p.state==='new')nN++;else if(p.state==='learning')nL++;
    else if(p.state==='review')nR++;else if(p.state==='hard')nH++;
    else if(p.state==='done')nD++;
    if(p.state!=='new'&&p.nextReview<=now)nDue++;
  });
  var nt=Math.min(newLeft(),nN),tot=nDue+nt;
  var pd=base.length>0?Math.round(nD/base.length*100):0;
  return{total:base.length,nNew:nN,nL:nL,nR:nR,nH:nH,nD:nD,nDue:nDue,newToday:nt,todayTotal:tot,pctDone:pd};
}

// Racha: días en que se ha respondido al menos una tarjeta (cfg.dias, campo añadido el 9-nov-2026)
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function markDay(){var t=todayStr();cfg.dias=cfg.dias||[];if(cfg.dias[cfg.dias.length-1]!==t){cfg.dias.push(t);if(cfg.dias.length>4000)cfg.dias=cfg.dias.slice(-4000);saveCfg();}}
function racha(){
  var s={};(cfg.dias||[]).forEach(function(x){s[x]=1;});
  var d=new Date();if(!s[dayStr(d)])d.setDate(d.getDate()-1);
  var n=0;while(s[dayStr(d)]){n++;d.setDate(d.getDate()-1);}

}

function hayVoz(){return typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';}
function decir(txt){
  if(!hayVoz())return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';u.rate=.85;
    // Mandarín: zh-CN primero; si no, zh-TW. Nunca zh-HK (cantonés).
    var vs=speechSynthesis.getVoices(),v=vs.filter(function(x){return/^zh[-_](CN|Hans)/i.test(x.lang);})[0]||vs.filter(function(x){return/^zh[-_]TW/i.test(x.lang);})[0];if(v)u.voice=v;
    speechSynthesis.speak(u);}catch(e){}
}

  var now=Date.now(),p=prog[k]||dp();

  prog[k]={seen:1,ok:1,fail:0,pct:100,state:'done',interval:43200,nextReview:now+43200*60000,lastReview:now,ease:2.5,streak:4,conocida:1};

// Próximo repaso de hoy (las falladas vuelven a los 10 min): para decirlo en vez de «no hay nada»
function proximoRepaso(){
  var lv=filter.level,now=Date.now(),fin=new Date();fin.setHours(23,59,59,999);
  var base=dedup(lv==='all'?V:V.filter(function(w){return w.N===lv;})),t=0,n=0;
  base.forEach(function(w){var p=gp(w);if(p.state!=='new'&&p.nextReview>now&&p.nextReview<=fin.getTime()){if(!t||p.nextReview<t)t=p.nextReview;}});
  if(!t)return'';
  base.forEach(function(w){var p=gp(w);if(p.state!=='new'&&p.nextReview>now&&p.nextReview<=t+60000)n++;});
  var d=new Date(t),hh=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  return(n===1?'1 palabra vuelve':n+' palabras vuelven')+' a salir a las '+hh+'.';
}
function sessionDone(s){
  var pct=s.done>0?Math.round(s.ok/s.done*100):0,prox=proximoRepaso();
  if(s.queue.length===0){
    // Sesión sin tarjetas: se explica por qué en vez de felicitar por «0 palabras»
    var lim='Has llegado al límite de '+cfg.newPerDay+' palabras nuevas de hoy. Mañana habrá más, o puedes subir el límite en Ajustes.';
    var msg=/^quick/.test(s.mode)?'Las tandas rápidas usan palabras que ya has visto, y en este nivel aún no hay ninguna.':
      s.mode==='new'?(newLeft()===0?lim:'Ya has empezado todas las palabras de este nivel.'):
      s.mode==='today'?(newLeft()===0?lim:'No tienes repasos pendientes ni palabras nuevas en este nivel.'):
      'No hay palabras para esta sesión.';
    if(prox)msg=prox+' '+msg;
    return"<div class='empty-state'><div class='empty-icon'>"+ico('mountain')+"</div><h2 class='empty-title' tabindex='-1'>Nada que repasar aquí</h2><div class='empty-sub'>"+msg+"</div><div class='empty-actions'><button class='btn-secondary' id='btn-go-home'>Volver al inicio</button></div></div>";
  }
  var d=s.dist||{},fl=(s.fallos||[]).map(function(k){return V.find(function(w){return wk(w)===k;});}).filter(Boolean);
  var h="<div class='empty-state' style='padding-bottom:12px'><div class='empty-icon'>"+ico('mountain')+"</div><h2 class='empty-title' tabindex='-1'>"+(s.terminada?'Sesión terminada':'¡Sesión completada!')+"</h2></div>";
  h+="<div class='result-card'><div class='result-top'><div><div class='result-n'>"+s.done+"</div><div class='result-l'>"+(s.done===1?'tarjeta':'tarjetas')+"</div></div><div><div class='result-n'>"+pct+"%</div><div class='result-l'>de aciertos</div></div></div>";
  if(s.dist)h+="<div class='dist'>"+[['again','Otra vez'],['hard','Difícil'],['good','Bien'],['easy','Fácil']].map(function(x){return"<div class='dist-i'><b>"+(d[x[0]]||0)+"</b>"+x[1]+"</div>";}).join('')+"</div>";
  if(fl.length)h+="<div class='result-list'><div class='result-list-t'>Para practicar más</div>"+fl.map(function(w){return"<span class='result-chip'><span class='zh' lang='zh-CN'>"+esc(w.C)+"</span>"+esc(w.P)+"</span>";}).join('')+"</div>";
  if(prox)h+="<div class='result-next'>"+prox+"</div>";
  if(guardadoOk)h+="<div class='result-next'>Todo lo respondido está guardado.</div>";
  // Solo se ofrece lo que tiene tarjetas (antes salía «Palabras nuevas» con el límite gastado)
  var st=getStats(),hayNuevas=newLeft()>0&&st.nNew>0;
  h+="</div><div class='empty-state' style='padding-top:4px'><div class='empty-actions'>"+(st.todayTotal>0?"<button type='button' class='btn-primary' id='btn-go-today'>Continuar Para hoy</button>":"")+(hayNuevas?"<button type='button' class='btn-secondary' id='btn-go-new'>Palabras nuevas</button>":"")+"<button type='button' class='"+(st.todayTotal>0?'btn-secondary':'btn-primary')+"' id='btn-go-home'>Volver al inicio</button></div></div>";
  return h;
}

// F8: sin tildes, sin espacios y con v por ü; si se escribe con tono, se busca ese tono.
function sinTildes(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function renderVocabList(){
  var base=vf.level==='all'?V:V.filter(function(w){return w.N===vf.level;});
  base=dedup(base);
  if(vf.state==='hard')base=base.filter(function(w){return esDificil(gp(w));});
  else if(vf.state!=='all')base=base.filter(function(w){return gp(w).state===vf.state;});
  if(vf.sort==='diff')base.sort(function(a,b){return gp(a).pct-gp(b).pct;});
  else if(vf.sort==='alpha')base.sort(function(a,b){return a.E.localeCompare(b.E);});
  else base.sort(function(a,b){return gp(b).lastReview-gp(a).lastReview;});
  var q=vf.q.trim().toLowerCase();
  if(q){
    // ¯ ˇ ` solo existen en pinyin: con ellas no se busca en el español (la tilde aguda sí puede ser español)
    var soloPin=/[\u0304\u030c\u0300]/.test(q.normalize('NFD'));
    var conTono=/[\u0304\u0301\u030c\u0300]/.test(q.normalize('NFD')),qs=q.replace(/\s+/g,''),qn=sinTildes(qs),qp=qn.replace(/v/g,'u');
    var pin=[],esp=[];
    base.forEach(function(w){
      var pw=w.P.toLowerCase().replace(/[\s']/g,'');
      if(w.C.indexOf(qs)>=0||(conTono?pw.normalize('NFD').indexOf(qs.normalize('NFD'))>=0:sinTildes(pw).indexOf(qp)>=0))pin.push(w);
      else if(!soloPin){var e=sinTildes(w.E);if(e.indexOf(sinTildes(q))>=0||e.replace(/\s+/g,'').indexOf(qn)>=0)esp.push(w);}
    });
    base=pin.concat(esp);
  }
  var h="<div class='voc-count' role='status'>"+pl(base.length,'palabra','palabras')+"</div>";
  if(!base.length)h+="<div class='empty'>Sin resultados. Se busca en español, en caracteres simplificados (学, no 學) y en pinyin con o sin tildes (ni hao, nǐ hǎo; sin números).</div>";
  base.forEach(function(w){
    var p=gp(w);
    h+="<button type='button' class='voc-item' data-ficha='"+esc(wk(w))+"' aria-label='"+esc(w.C+' '+w.P+', '+w.E)+". Abrir ficha'><div class='voc-char' lang='zh-CN'>"+esc(w.C)+"</div><div class='voc-info'><div class='voc-esp'>"+esc(w.E)+"</div><div class='voc-pin' lang='zh-Latn-pinyin'>"+esc(w.P)+"</div></div><div class='voc-right'>"+sbadge(p.state)+(p.seen>0?"<div class='voc-pct' style='color:"+pcol(p.pct)+"'>"+p.pct+"%</div><div class='voc-seen'>"+pl(p.seen,'repaso','repasos')+"</div>":"<div class='voc-seen'>Sin repasar</div>")+"</div></button>";
  });
  document.getElementById('voc-list').innerHTML=h;
}

// Mismo formato que herramientas/progreso-exportar.js (hsk-respaldo-1): el texto de cada
// clave «hsk-» tal cual, para poder restaurarlo byte a byte (y compararlo con comparar_respaldos.py).
var NPD=[5,10,15,20,25,30];
function hskKeys(){var r=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('hsk-')===0)r.push(k);}return r.sort();}
function exportData(){
  var claves={},d=new Date(),p2=function(n){return('0'+n).slice(-2);};
  try{hskKeys().forEach(function(k){claves[k]=localStorage.getItem(k);});}catch(e){alert('No se ha podido leer el progreso de este navegador.');return;}
  if(!(KP in claves))claves[KP]=JSON.stringify(prog); // la copia lleva siempre el progreso (importData lo exige)
  var n=0;Object.keys(prog).forEach(function(k){if(prog[k]&&prog[k].seen>0)n++;});
  var datos={formato:'hsk-respaldo-1',exportado:d.toISOString(),origen:location.href,navegador:navigator.userAgent,
    resumen:{claves:Object.keys(claves),palabrasConProgreso:n},claves:claves};
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(datos,null,1)],{type:'application/json'}));
  a.download='progreso-hsk-'+d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},10000);
  aviso('Descarga iniciada: '+a.download+'. Búscala en Descargas (en el iPhone, en la app Archivos).');
}
function importData(f){
  var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result);}catch(e){d=null;}
    // Debe traer hsk-prog-v2, y toda clave conocida tiene que ser un objeto JSON válido
    var ok=isObj(d)&&d.formato==='hsk-respaldo-1'&&isObj(d.claves)&&typeof d.claves['hsk-prog-v2']==='string'&&
      Object.keys(d.claves).every(function(k){
        if(k.indexOf('hsk-')!==0||typeof d.claves[k]!=='string')return false;
        if([KP,KS,KCF,'hsk-prog-v1'].indexOf(k)<0)return true;
        try{return isObj(JSON.parse(d.claves[k]));}catch(e){return false;}
      });
    if(!ok){alert('Ese fichero no es una copia de progreso de HSK Trainer (debe ser el .json de «Exportar copia del progreso»). No se ha cambiado nada.');return;}
    var nueva=0;try{var pn=JSON.parse(d.claves['hsk-prog-v2']||'{}');Object.keys(pn).forEach(function(k){if(pn[k]&&pn[k].seen>0)nueva++;});}catch(e){}
    var ahora=0;Object.keys(prog).forEach(function(k){if(prog[k]&&prog[k].seen>0)ahora++;});
    if(!confirm('Se sustituirá el progreso de este navegador ('+ahora+' palabras con repasos) por el de la copia del '+String(d.exportado||'').slice(0,10)+' ('+nueva+' palabras). Si quieres conservar lo de ahora, cancela y exporta antes una copia. ¿Seguir?'))return;
    // Se guarda en memoria lo que hay; si algo falla al escribir, se vuelve a dejar como estaba
    var antes={};hskKeys().forEach(function(k){antes[k]=localStorage.getItem(k);});
    try{
      hskKeys().forEach(function(k){if(!(k in d.claves))localStorage.removeItem(k);});
      Object.keys(d.claves).forEach(function(k){localStorage.setItem(k,d.claves[k]);});
    }catch(e){
      try{
        hskKeys().forEach(function(k){localStorage.removeItem(k);});
        Object.keys(antes).forEach(function(k){localStorage.setItem(k,antes[k]);});
        alert('La copia no cabe en el almacenamiento de este navegador. No se ha cambiado nada.');
      }catch(e2){alert('No se ha podido importar ni volver al estado anterior. Exporta lo que haya y vuelve a importar la copia.');}
      return;
    }
    location.reload();
  };
  r.onerror=function(){alert('No se ha podido leer el fichero.');};
  r.readAsText(f);
}

function temaPalabras(t){
  if(!t||!t.parejas||!t.parejas.length)return null;

    var p=t.parejas[i],w=V.filter(function(x){return x.C===p.c&&(!p.n||x.N===p.n);})[0];

}

  temaPalabras(t).forEach(function(x,i){cs.push({par:i,lado:'c',w:x.w,p:x.p,estado:'abajo'});cs.push({par:i,lado:'v',w:x.w,p:x.p,estado:'abajo'});});
  clearTimeout(memoT);
  memo={tema:t.id,nombre:t.nombre,cartas:barajar(cs),abiertas:[],movs:0,hechas:0,total:cs.length/2,bloqueo:false,fin:false,msg:MEMO_INI,t0:Date.now(),t1:0};
  juegoVista='partida';render();
  // El foco va al título, no a una carta: una tecla mantenida en «Otra vez» no destapa nada
  enfocar('#jg-titulo');
  anunciar('Memory de '+t.nombre.toLowerCase()+': '+cs.length+' cartas boca abajo. '+MEMO_INI);
}
function cerrarAbiertas(){
  clearTimeout(memoT);if(!memo)return;
  memo.abiertas.forEach(function(i){var c=memo.cartas[i];if(c.estado==='arriba')c.estado='abajo';c.mal=false;pintarCarta(i);});
  memo.abiertas=[];memo.bloqueo=false;
  // Tras un fallo, el mensaje vuelve a la instrucción (sin volver a anunciarlo)
  if(memo.msgCls==='no'){memo.msg=MEMO_INI;memo.msgCls='';var m=document.getElementById('memo-msg');if(m){m.textContent=MEMO_INI;m.className='memo-msg';}}
}
function girarCarta(i){
  if(!memo||memo.fin)return;
  var c=memo.cartas[i];if(!c||c.estado==='hecha')return;
  // Con dos cartas que no son pareja a la vista, tocar otra las tapa y abre la tocada (tocar una de las dos solo las tapa)
  if(memo.bloqueo){var eraAbierta=memo.abiertas.indexOf(i)>=0;cerrarAbiertas();if(eraAbierta)return;}
  if(c.estado!=='abajo')return; // la misma carta otra vez
  c.estado='arriba';memo.abiertas.push(i);pintarCarta(i);
  if(c.lado==='c')decir(c.w.C);
  if(memo.abiertas.length===1){memoMsg('Ahora busca su pareja.',cartaDescHTML(c)+'. Ahora busca su pareja.');return;}
  memo.movs++;
  var j=memo.abiertas[0],a=memo.cartas[j];
  if(a.par===c.par){
    a.estado=c.estado='hecha';memo.abiertas=[];memo.hechas++;pintarCarta(j);pintarCarta(i);pintarCont();
    if(memo.hechas===memo.total){
      memo.fin=true;memo.t1=Date.now();memoMsg('¡Pareja! <span lang="zh-CN">'+esc(c.w.C)+'</span> = '+esc(c.p.nombre)+'. ¡Terminado!','Pareja: '+zhHTML(c.w)+', '+esc(c.p.nombre)+'. ¡Has terminado!','ok');
      memoT=setTimeout(function(){if(curTab==='juegos'&&memo&&memo.fin){render();enfocar('.empty-title');anunciar('¡Hecho! '+intentos(memo.movs)+'.');}},MEMO_FIN_MS);
    }else memoMsg('¡Pareja! <span lang="zh-CN">'+esc(c.w.C)+'</span> = '+esc(c.p.nombre),'Pareja: '+zhHTML(c.w)+', '+esc(c.p.nombre)+'. Llevas '+memo.hechas+' de '+memo.total+'.','ok');
  }else{
    a.mal=c.mal=true;memo.bloqueo=true;pintarCarta(j);pintarCarta(i);pintarCont();
    memoMsg('No es pareja. Toca otra carta.','No es pareja: '+cartaDescHTML(a)+' y '+cartaDescHTML(c)+'.','no');
    memoT=setTimeout(cerrarAbiertas,MEMO_FALLO_MS);
  }
}
// Flechas para moverse por el tablero (Inicio/Fin: primera y última carta)
function teclasTablero(e){
  if(curTab!=='juegos'||!memo||memo.fin)return;
  var b=e.target.closest&&e.target.closest('.memo-card');if(!b)return;
  var cs=Array.prototype.slice.call(document.querySelectorAll('.memo-card')),i=cs.indexOf(b),n=cs.length;
  var cols=getComputedStyle(document.getElementById('memo-board')).gridTemplateColumns.split(' ').length||3;
  var d={ArrowRight:1,ArrowLeft:-1,ArrowDown:cols,ArrowUp:-cols}[e.key],k=-1;
  if(d!==undefined){k=i+d;if(k<0||k>=n)return;}else if(e.key==='Home')k=0;else if(e.key==='End')k=n-1;else return;
  e.preventDefault();cs[k].focus();
}
function salirMemo(){clearTimeout(memoT);memo=null;anunciar('');}
// Clics del panel de juegos; devuelve true si el clic era suyo
function clicJuegos(t){
  if(curTab!=='juegos')return false;
  var card=t.closest('.memo-card');if(card){girarCarta(+card.dataset.i);return true;}
  if(t.closest('#jg-memory')){juegoVista='temas';render();enfocar('#jg-titulo');return true;}
  var tm=t.closest('[data-tema]');if(tm){if(!tm.disabled)empezarMemo(tm.dataset.tema);return true;}
  if(t.closest('#memo-otra')){empezarMemo(memo.tema);return true;}
  if(t.closest('#memo-estudiar')){salirMemo();juegoVista='lista';curTab='study';render();enfocar('#btn-start');return true;}
  if(t.closest('#memo-temas')||t.closest('#jg-volver')){
    var desde=juegoVista;
    if(desde==='partida'){salirMemo();juegoVista='temas';}else juegoVista='lista';
    render();enfocar(desde==='partida'?"[data-tema]:not([disabled])":'#jg-memory');return true;
  }
  return false;
}

function onNC(e){
  var b=e.target.closest('[data-tab]');if(!b)return;
  curTab=b.dataset.tab;render();
}

function onMC(e){
  var t=e.target;
  if(clicJuegos(t))return;
  var au=t.closest('.btn-audio');if(au){decir(au.dataset.say);return;}
  if(t.closest('#btn-practicar-dif')){resumen=null;filter.sessionMode=cfg.smode='hard';saveCfg();startSession('hard');curTab='study';flipped=false;render();trasCambio();return;}
  if(t.id==='btn-reveal'||t.closest('#btn-reveal')){revelar();return;}
  if(t.closest('#btn-pres')){presentada();return;}
  var bc=t.closest('#btn-conocida');if(bc){yaLaConozco(bc.dataset.k);flipped=false;pinEscrito='';renderStudy();renderStats();trasCambio();return;}
  var fi=t.closest('[data-ficha]');if(fi){abrirFicha(fi.dataset.ficha,fi);return;}
  var abtn=t.closest('[data-r]');
  if(abtn){valorar(abtn.dataset.r);return;}
  if(t.closest('#btn-end')||t.closest('#btn-pausa-fin')){terminarSesion();return;}
  if(t.closest('#btn-pausa')){pausada=true;flipped=false;pinEscrito='';render();enfocar('.empty-title');anunciar('Sesión en pausa. Ya puedes ir a otras pestañas.');return;}
  if(t.closest('#btn-continuar')){pausada=false;render();trasCambio();return;}
  if(t.id==='btn-go-today'||t.closest('#btn-go-today')){resumen=null;filter.sessionMode=cfg.smode='today';saveCfg();startSession('today');flipped=false;renderStudy();trasCambio();return;}
  if(t.id==='btn-go-new'||t.closest('#btn-go-new')){resumen=null;filter.sessionMode=cfg.smode='new';saveCfg();startSession('new');flipped=false;renderStudy();trasCambio();return;}
  if(t.id==='btn-go-hard'||t.closest('#btn-go-hard')){resumen=null;filter.sessionMode=cfg.smode='hard';saveCfg();startSession('hard');flipped=false;renderStudy();trasCambio();return;}
  if(t.id==='btn-go-home'||t.closest('#btn-go-home')){resumen=null;endSession();render();enfocar('#btn-start');return;}
}

// Los números (ni3 hao3) se pasan a tildes en su sílaba, con la regla habitual: a o e; si no, la o de «ou»;
// si no, la última vocal. Después se compara la escritura entera, con el tono en su sílaba.
var TILDE={1:'̄',2:'́',3:'̌',4:'̀'};
function ponerTono(sil,n){
  if(!TILDE[n])return sil;
  var i=sil.indexOf('a');if(i<0)i=sil.indexOf('e');if(i<0&&sil.indexOf('ou')>=0)i=sil.indexOf('ou');
  if(i<0){for(var j=sil.length-1;j>=0;j--)if('aeiouü'.indexOf(sil.charAt(j))>=0){i=j;break;}}
  return i<0?sil:sil.slice(0,i+1)+TILDE[n]+sil.slice(i+1);
}
function pinClave(t){
  t=String(t).toLowerCase().normalize('NFC').replace(/v/g,'ü');
  var out='',sil='';
  t.split('').forEach(function(ch){
    if(/[0-5]/.test(ch)){out+=ponerTono(sil,+ch);sil='';}
    else if(/[\s'’\-]/.test(ch)){out+=sil;sil='';}
    else sil+=ch;
  });
  out+=sil;
  return out.normalize('NFD').replace(/[^a-z̀́̄̌̈]/g,'');
}
function compararPinyin(escrito,objetivo){
  var a=pinClave(escrito),b=pinClave(objetivo);
  if(a===b)return'ok';
  var sin=function(x){return x.replace(/[̀́̄̌]/g,'');};
  return sin(a)===sin(b)?'tonos':'no';
}
// Ficha de palabra (Vocabulario): datos, audio y «Ya la conozco»
function abrirFicha(k,origen){
  var w=V.find(function(x){return wk(x)===k;});if(!w)return;
  var p=gp(w),voz=hayVoz();
  var datos=p.conocida?'Marcada como «ya la conozco».':p.seen>0?pl(p.seen,'repaso','repasos')+' · '+p.pct+' % de aciertos · '+pl(p.fail,'fallo','fallos')+'<br>Próximo repaso: '+(p.nextReview<=Date.now()?'ya toca':new Date(p.nextReview).toLocaleString('es-ES',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})):'Todavía sin repasar.';
  var h="<div class='modal-overlay' id='foverlay'><div class='modal modal-ficha' role='dialog' aria-modal='true' aria-labelledby='fi-t'>"
    +"<div style='display:flex;gap:6px;margin-bottom:10px'>"+lbadge(w.N)+sbadge(p.state)+"</div>"
    +"<div class='ficha-top'><h2 class='ficha-char' id='fi-t' lang='zh-CN'>"+esc(w.C)+"</h2>"+(voz?"<button type='button' class='btn-audio' data-say='"+esc(w.C)+"' aria-label='Escuchar "+esc(w.C)+"'>"+ico('speaker')+"</button>":"")+"</div>"
    +"<div class='ficha-pin' lang='zh-Latn-pinyin'>"+esc(w.P)+"</div><div class='ficha-esp'>"+esc(w.E)+"</div>"
    +(w.S?"<div class='ficha-ej'><div class='card-sentence-zh' lang='zh-CN'>"+esc(w.S)+"</div>"+(w.SY?"<div class='card-sentence-py' lang='zh-Latn-pinyin'>"+esc(w.SY)+"</div>":"")+"<div class='card-sentence-es'>"+esc(w.SP)+"</div>"+(voz?"<button type='button' class='btn-audio sm' data-say='"+esc(w.S)+"' aria-label='Escuchar la frase'>"+ico('speaker')+"</button>":"")+"</div>":"")
    +"<div class='ficha-datos'>"+datos+"</div><div class='modal-btns'>"
    +(p.conocida?"<button type='button' class='btn-secondary' id='fi-quitar'>Quitar «ya la conozco»</button>":p.seen===0?"<button type='button' class='btn-secondary' id='fi-conozco'>Ya la conozco</button>":"")
    +"<button type='button' class='btn-cancel' id='fi-cerrar'>Cerrar</button></div></div></div>";
  document.getElementById('modal').innerHTML=h;fondo(true);
  var m=document.getElementById('modal');
  var cerrar=function(){document.removeEventListener('keydown',tec);hideModal();fondo(false);var o=document.querySelector("[data-ficha='"+k.replace(/'/g,"\\'")+"']")||origen;if(o)try{o.focus();}catch(x){}};
  var tec=function(e){
    if(e.key==='Escape'){cerrar();return;}
    if(e.key==='Tab'){var f=m.querySelectorAll('button'),a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
  };
  document.addEventListener('keydown',tec);
  document.getElementById('foverlay').addEventListener('click',function(e){
    var t=e.target,au=t.closest('.btn-audio');if(au){decir(au.dataset.say);return;}
    if(t.id==='foverlay'||t.closest('#fi-cerrar')){cerrar();return;}
    if(t.closest('#fi-conozco')){yaLaConozco(k);cerrar();renderVocabList();renderStats();anunciar('Marcada como ya la conozco.');return;}
    if(t.closest('#fi-quitar')){quitarConocida(k);cerrar();renderVocabList();renderStats();anunciar('Vuelve a ser nueva.');return;}
  });
  enfocar('#fi-cerrar');
}
// Foco y anuncios para teclado y lector de pantalla (antes el foco caía en la página tras cada acción)
function enfocar(sel){var e=document.querySelector(sel);if(e)try{e.focus({preventScroll:true});}catch(x){e.focus();}}
function anunciar(t){var a=document.getElementById('anuncio');if(!a)return;a.textContent='';if(t)setTimeout(function(){a.textContent=t;},60);}
function anversoTxt(w){return filter.mode==='esp2chi'?w.E:w.C;}
// Tras empezar, valorar o cambiar de sesión: foco en el siguiente botón útil y aviso de la tarjeta
function trasCambio(){
  if(curTab!=='study')return;
  var c=session?curCard():null;
  if(c&&document.getElementById('btn-pres')){enfocar('#btn-pres');anunciar('Palabra nueva: '+c.C+', '+c.P+', '+c.E+'.');}
  else if(c){enfocar(document.getElementById('pin-in')?'#pin-in':'#btn-reveal');var q=session.queue.length-session.idx;anunciar('Tarjeta nueva. '+(q===1?'Queda 1':'Quedan '+q)+'. '+anversoTxt(c));}
  else if(session||resumen){enfocar('.empty-title');var h=document.querySelector('.empty-title');anunciar(h?h.textContent:'');}
}
function revelar(){
  var c=session?curCard():null;if(!c||flipped)return;
  if(document.getElementById('btn-pres')){presentada();return;}
  var pi=document.getElementById('pin-in');pinEscrito=pi?pi.value.trim().slice(0,60):'';
  flipped=true;renderStudy();enfocar('.a-good');
  anunciar('Respuesta: '+c.C+', '+c.P+', '+c.E+'.');
}
function valorar(r){var c=session?curCard():null;if(!c||!flipped)return;applyAnswer(c,r);flipped=false;pinEscrito='';renderStudy();renderStats();trasCambio();}
// Atajos: Espacio o Intro para ver la respuesta; 1 a 4 para valorar (Otra vez, Difícil, Bien, Fácil)
function atajos(){
  document.addEventListener('keydown',function(e){
    if(curTab!=='study'||!session||pausada||!curCard()||e.altKey||e.ctrlKey||e.metaKey)return;
    // Con la tecla mantenida, la repetición encadenaría «Ver respuesta» y «Bien» sin estudiar la tarjeta
    if(e.repeat){if(e.key===' '||e.key==='Enter'||'1234'.indexOf(e.key)>=0)e.preventDefault();return;}
    if(document.querySelector('#modal .modal'))return;
    var a=document.activeElement,tag=a&&a.tagName;
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
    if(!flipped&&(e.key===' '||e.key==='Enter')){if(tag==='BUTTON'&&a.id!=='btn-reveal')return;e.preventDefault();revelar();return;}
    if(flipped){var i=['1','2','3','4'].indexOf(e.key);if(i>=0){e.preventDefault();valorar(['again','hard','good','easy'][i]);}}
  });
}
function aviso(t){
  var a=document.getElementById('toast');if(a)a.remove();
  a=document.createElement('div');a.id='toast';a.className='toast';a.setAttribute('role','status');a.textContent=t;
  document.body.appendChild(a);setTimeout(function(){if(a.parentNode)a.remove();},6000);
}

function mlabel(m){return{today:'Para hoy',new:'Nuevas',hard:'Difíciles',all:'Todo',quick10:'Rápida 10',quick20:'Rápida 20',quick30:'Rápida 30'}[m]||m;}
